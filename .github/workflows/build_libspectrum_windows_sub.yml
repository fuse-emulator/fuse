name: Libspectrum for Windows
run-name: Build and test Libspectrum for Windows / ${{ github.actor }} /

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      libspectrum_ref:
        type: string
        default: master
      use_zlib:
        type: boolean
        default: true
      use_bzip2:
        type: boolean
        default: true
      use_libgcrypt:
        type: boolean
        default: true
      use_libaudiofile:
        type: boolean
        default: true

jobs:
  build:
    name: Build & Test (MSYS2 MINGW32)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      LIBSPECTRUM_DIR: libspectrum
      LIBSPECTRUM_GIT_URL: https://github.com/fuse-emulator/libspectrum
      CPPFLAGS: -I/opt/fuse/include
      LDFLAGS: -L/opt/fuse/lib

    steps:
      # Use the workflow revision's packaging helpers, not the selected library ref.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MSYS2 build tools and native 32-bit dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          cache: true
          install: >-
            autoconf-wrapper automake-wrapper libtool make git curl
            mingw-w64-i686-gcc mingw-w64-i686-pkgconf
            mingw-w64-i686-bzip2 mingw-w64-i686-zlib

      - name: Cache pinned cryptographic package downloads
        if: ${{ inputs.use_libgcrypt }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fuse-mingw32-crypto
          key: msys2-mingw32-crypto-v1-${{ hashFiles('.github/scripts/windows-mingw32-crypto.sha256') }}

      - name: Install pinned MSYS2 cryptographic libraries
        if: ${{ inputs.use_libgcrypt }}
        run: |
          cache="$(cygpath -u "$RUNNER_TEMP")/fuse-mingw32-crypto"
          # Recheck hashes and signatures on cache hits as well as fresh downloads.
          bash .github/scripts/install_windows_crypto.sh "$cache"
          mkdir -p /opt/fuse/share/fuse/packages
          cp "$cache/"*.pkg.tar.zst "$cache/"*.pkg.tar.zst.sig /opt/fuse/share/fuse/packages/

      - name: Build pinned patched audiofile
        if: ${{ inputs.use_libaudiofile }}
        run: |
          bash .github/scripts/build_windows_audiofile.sh "$(cygpath -u "$RUNNER_TEMP")/audiofile-build"

      - name: Clone selected libspectrum revision
        env:
          LIBSPECTRUM_REF: ${{ inputs.libspectrum_ref }}
        run: |
          git init "$LIBSPECTRUM_DIR"
          git -C "$LIBSPECTRUM_DIR" remote add origin "$LIBSPECTRUM_GIT_URL"
          git -C "$LIBSPECTRUM_DIR" fetch --depth 1 origin "$LIBSPECTRUM_REF"
          git -C "$LIBSPECTRUM_DIR" checkout FETCH_HEAD
          git -C "$LIBSPECTRUM_DIR" rev-parse HEAD
          gcc --version

      - name: Configure libaudiofile-backed libspectrum
        working-directory: ${{ env.LIBSPECTRUM_DIR }}
        run: |
          set -o pipefail
          export PATH="/opt/fuse/bin:$PATH"
          # /etc/profile resets this variable when each MSYS2 shell starts.
          export PKG_CONFIG_PATH="/opt/fuse/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          if [ "${{ inputs.use_libaudiofile }}" = true ]; then
            pkg-config --modversion audiofile
          fi
          ./autogen.sh
          # Keep the normal static archive available for internal unit tests.
          ./configure --prefix=/opt/fuse --with-fake-glib \
            ${{ inputs.use_zlib == false && '--without-zlib' || '' }} \
            ${{ inputs.use_bzip2 == false && '--without-bzip2' || '' }} \
            ${{ inputs.use_libgcrypt == false && '--without-libgcrypt' || '' }} \
            ${{ inputs.use_libaudiofile == false && '--without-libaudiofile' || '' }} \
            2>&1 | tee configure.out
          .github/scripts/in_config.sh "libaudiofile support: ${{ inputs.use_libaudiofile && 'yes' || 'no' }}"
          .github/scripts/in_config.sh "Internal GLib replacement: yes"
          .github/scripts/in_config.sh "libgcrypt support: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"

      - name: Build, test and install
        working-directory: ${{ env.LIBSPECTRUM_DIR }}
        run: |
          export PATH="/opt/fuse/bin:$PATH"
          make -j2
          make check
          make install-strip

      - name: Stage exact runtime dependencies and notices
        run: |
          bash data/win32/check_win32_dll_deps.sh /opt/fuse/bin
          bash .github/scripts/collect_windows_notices.sh /opt/fuse/bin /opt/fuse/share/fuse/3rd-party
          pacman -Q > /opt/fuse/share/fuse/msys2-packages.txt
          printf 'libspectrum %s %s\n' "$(git -C "$LIBSPECTRUM_DIR" rev-parse HEAD)" "$LIBSPECTRUM_GIT_URL" \
            >> /opt/fuse/share/fuse/source-versions.txt
          cp "$LIBSPECTRUM_DIR/COPYING" /opt/fuse/share/fuse/3rd-party/libspectrum-COPYING.txt
          # Include native DLLs used by this build, not independently selected ones.
          tar -cvf libspectrum-installed-windows.tar -C /opt/fuse .

      - name: Upload library, runtime DLLs and package manifest
        uses: actions/upload-artifact@v7
        with:
          name: libspectrum-installed-windows-${{ inputs.key }}
          path: libspectrum-installed-windows.tar
