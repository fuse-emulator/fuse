# Reusable workflow for native 32-bit Windows builds with MSYS2 MINGW32.
name: Fuse App For Windows
run-name: Build Fuse App for Windows / ${{ github.actor }} /

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      dependencies:
        type: string
        default: ""
      configure_params:
        type: string
        default: ""
      fuse_ref:
        type: string
        default: ""
      fuse_version:
        type: string
        default: ""
      verify_ui:
        type: string
        required: true
      verify_audio:
        type: string
        default: directsound
      verify_libxml2:
        type: string
        default: "no"
      verify_other:
        type: string
        default: ""
      upload_artifacts:
        type: boolean
        default: true
      build_setup:
        type: boolean
        default: false
      run_check:
        type: boolean
        default: false

jobs:
  build:
    name: Build App (MSYS2 MINGW32)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      CPPFLAGS: -I/opt/fuse/include
      LDFLAGS: -L/opt/fuse/lib
      PKG_CONFIG_PATH: /opt/fuse/lib/pkgconfig

    steps:
      # Keep helpers at the workflow revision even when building an older Fuse ref.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Save workflow packaging helpers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fuse-windows-helpers"
          cp data/win32/check_win32_dll_deps.sh .github/scripts/collect_windows_notices.sh \
            .github/scripts/install_windows_crypto.sh .github/scripts/windows-mingw32-crypto.sha256 \
            "$RUNNER_TEMP/fuse-windows-helpers/"

      - name: Check out requested Fuse revision
        if: ${{ inputs.fuse_ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.fuse_ref }}
          persist-credentials: false

      - name: Install MSYS2 build tools and native 32-bit dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          cache: true
          install: >-
            autoconf-wrapper automake-wrapper libtool make git bison flex dos2unix
            man2html zip curl
            mingw-w64-i686-gcc mingw-w64-i686-pkgconf
            mingw-w64-i686-bzip2 mingw-w64-i686-zlib
            mingw-w64-i686-libpng
            ${{ inputs.dependencies }}

      # NSIS is a host tool; it need not match the target executable's bitness.
      - name: Install NSIS
        if: ${{ inputs.build_setup }}
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Expose native NSIS to MSYS2
        if: ${{ inputs.build_setup }}
        run: |
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/makensis <<'EOF'
          #!/bin/sh
          for candidate in \
            "/c/ProgramData/chocolatey/bin/makensis.exe" \
            "/c/Program Files (x86)/NSIS/makensis.exe" \
            "/c/Program Files/NSIS/makensis.exe"; do
            if [ -x "$candidate" ]; then
              exec "$candidate" "$@"
            fi
          done
          echo "makensis executable not found" >&2
          exit 1
          EOF
          chmod +x /usr/local/bin/makensis

      - name: Download libspectrum and runtime DLLs
        uses: actions/download-artifact@v8
        with:
          name: libspectrum-installed-windows-fuse-app
          path: libspectrum

      - name: Install libspectrum and verify matching dependency versions
        run: |
          mkdir -p /opt/fuse
          tar -xvf libspectrum/libspectrum-installed-windows.tar -C /opt/fuse
          if [ -d /opt/fuse/share/fuse/packages ]; then
            helpers="$(cygpath -u "$RUNNER_TEMP")/fuse-windows-helpers"
            bash "$helpers/install_windows_crypto.sh" /opt/fuse/share/fuse/packages
          fi
          # Independently updated runners must not silently mix runtime versions.
          while read -r package version; do
            case "$package" in
              mingw-w64-i686-*)
                installed="$(pacman -Q "$package")"
                test "$installed" = "$package $version" || {
                  echo "MSYS2 package drift: expected $package $version, got $installed; rebuild both jobs." >&2
                  exit 1
                }
                ;;
            esac
          done < /opt/fuse/share/fuse/msys2-packages.txt
          export PATH="/opt/fuse/bin:$PATH"
          git config --global core.autocrlf input
          git config --global --add safe.directory "$(pwd)"
          gcc --version
          pacman -Q > msys2-packages.txt

      - name: Adjust requested package version
        if: ${{ inputs.fuse_version }}
        env:
          FUSE_VERSION: ${{ inputs.fuse_version }}
        run: |
          sed -i "s/m4_define(\[fuse_version\], \[[^]]*\])/m4_define([fuse_version], [$FUSE_VERSION])/" configure.ac

      - name: Configure native Windows build
        id: configure
        run: |
          set -o pipefail
          export PATH="/opt/fuse/bin:$PATH"
          ./autogen.sh
          ./configure --prefix=/opt/fuse --disable-static \
            ${{ inputs.configure_params }} 2>&1 | tee configure.out
          .github/scripts/in_config.sh "User interface: ${{ inputs.verify_ui }}"
          .github/scripts/in_config.sh "libxml2 support: ${{ inputs.verify_libxml2 }}"
          .github/scripts/in_config.sh "Selected audio driver: ${{ inputs.verify_audio }}"
          .github/scripts/in_config.sh "zlib support: yes"
          .github/scripts/in_config.sh "libpng support: yes"
          .github/scripts/in_config.sh "Spectranet support: yes"
          .github/scripts/in_config.sh "SpeccyBoot support: no"
          .github/scripts/in_config.sh "TTX2000 S support: yes"
          .github/scripts/in_config.sh "Desktop integration: no"

      - name: Show configuration log on failure
        if: ${{ failure() && steps.configure.outcome == 'failure' }}
        run: cat config.log

      - name: Verify additional configuration
        if: ${{ inputs.verify_other }}
        run: .github/scripts/in_config.sh "${{ inputs.verify_other }}"

      - name: Build
        run: |
          export PATH="/opt/fuse/bin:$PATH"
          make -j2

      - name: Stage runtime DLLs and third-party notices
        id: stage
        run: |
          helpers="$(cygpath -u "$RUNNER_TEMP")/fuse-windows-helpers"
          version="$(./configure --version | head -1 | cut -d' ' -f3)"
          dest="fuse-${version}-${{ inputs.verify_ui }}"
          mkdir -p "$dest/3rd-party"
          cp /opt/fuse/bin/*.dll "$dest/"
          cp /opt/fuse/share/fuse/3rd-party/* "$dest/3rd-party/"
          # Start with the actual executable; do not guess FLAC/GCC runtime names.
          binary=fuse.exe
          test ! -f .libs/fuse.exe || binary=.libs/fuse.exe
          cp "$binary" "$dest/fuse.exe"
          bash "$helpers/check_win32_dll_deps.sh" "$dest"
          bash "$helpers/collect_windows_notices.sh" "$dest" "$dest/3rd-party"
          cp msys2-packages.txt /opt/fuse/share/fuse/source-versions.txt "$dest/"
          printf 'fuse %s\n' "$(git rev-parse HEAD)" >> "$dest/source-versions.txt"
          # Tests and libtool wrappers may load DLLs from these locations.
          cp "$dest/"*.dll z80/
          echo "directory=$dest" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: ${{ inputs.run_check }}
        run: |
          export PATH="/opt/fuse/bin:$PATH"
          make check

      - name: Build ZIP and optional NSIS installer
        run: |
          export PATH="/opt/fuse/bin:$PATH"
          make dist-win32-zip
          if [ "${{ inputs.build_setup }}" = true ]; then
            make dist-win32-exe
          fi

      - name: Upload distribution
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          path: |
            ${{ steps.stage.outputs.directory }}.zip
            ${{ steps.stage.outputs.directory }}.zip.sha1
            ${{ inputs.build_setup && format('{0}-setup.exe', steps.stage.outputs.directory) || '' }}
            ${{ inputs.build_setup && format('{0}-setup.exe.sha1', steps.stage.outputs.directory) || '' }}
